        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, io, os, zipfile
          encoded = "".join(os.environ["PLEXPOS_SOURCE_BASE64"].split())
          payload = base64.b64decode(encoded, validate=True)
          expected = os.environ["PLEXPOS_SOURCE_SHA256"]
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit("El código incluido está incompleto o dañado; vuelve a subir el archivo YAML completo.")
          root = Path.cwd().resolve()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError("Ruta inválida")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
          print("Código completo, SHA-256 válido y proyecto preparado.")
          PYCODE

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar plataforma y herramientas Android 35
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar el proyecto
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          java -version
          gradle --version

      - name: Ejecutar pruebas y compilar APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verificar APK y calcular SHA-256
        working-directory: app/build/outputs/apk/debug
        run: |
          test -s app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Entregar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: PlexPOS-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlexPOS-resultados-pruebas
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 14
